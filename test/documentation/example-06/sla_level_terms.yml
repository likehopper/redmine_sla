sla_level_terms:
  critical_response:
    sla_level: Critical
    sla_type: Response time
    sla_priority:
      Immediate: 5
      High: 15
      Urgent: 10
  critical_resolution:
    sla_level: Critical
    sla_type: Resolution deadline
    sla_priority:
      Immediate: 60
      High: 240
      Urgent: 120
  standard_response:
    sla_level: Standard
    sla_type: Response time
    sla_priority:
      Low: 120
      Normal: 60
  standard_resolution:
    sla_level: Standard
    sla_type: Resolution deadline
    sla_priority:
      Low: 960
      Normal: 480