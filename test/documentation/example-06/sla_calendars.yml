sla_calendars:
  - name: "24x7"
    description: Always-on support calendar.
    sla_schedules:
      Sunday:
        - ["00:00","23:59",true]
      Monday:
        - ["00:00","23:59",true]
      Tuesday:
        - ["00:00","23:59",true]
      Wednesday:
        - ["00:00","23:59",true]
      Thursday:
        - ["00:00","23:59",true]
      Friday:
        - ["00:00","23:59",true]
      Saturday:
        - ["00:00","23:59",true]
  - name: "Business hours"
    description: Weekdays from 09:00 to 17:00.
    sla_schedules:
      Monday:
        - ["09:00","17:00",true]
      Tuesday:
        - ["09:00","17:00",true]
      Wednesday:
        - ["09:00","17:00",true]
      Thursday:
        - ["09:00","17:00",true]
      Friday:
        - ["09:00","17:00",true]
